org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# AGP 9 enables its own Kotlin support by default, which cannot be combined
# with the Kotlin Multiplatform plugin. The desktop and Android targets share
# commonMain, so keep the KMP plugin in charge.
android.builtInKotlin=false
android.newDsl=false
